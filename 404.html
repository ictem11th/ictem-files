<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صفحه پیدا نشد</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f6f3ea; color:#14532d;
           font-family: Tahoma, sans-serif; text-align:center; }
    h1 { font-size:4rem; margin:0; color:#f2c94c; background:#14532d; display:inline-block; padding:0 28px; border-radius:16px; }
    a { color:#14532d; font-weight:bold; }
  </style>
</head>
<body>
  <div>
    <h1>۴۰۴</h1>
    <p>صفحه‌ای که دنبالش بودید پیدا نشد.</p>
    <p><a id="home" href="/">بازگشت به صفحه اصلی</a></p>
    <script>
      // در سایت پروژه‌ای (user.github.io/repo) صفحه اصلی داخل پوشه repo است
      if (location.hostname.endsWith(".github.io")) {
        var seg = location.pathname.split("/").filter(Boolean)[0];
        if (seg && seg !== "admin") document.getElementById("home").href = "/" + seg + "/";
      }
    </script>
  </div>
</body>
</html>
