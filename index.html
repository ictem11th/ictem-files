<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فایل‌های کنفرانس ICTEM</title>
  <meta name="theme-color" content="#14532d">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header banner">
    <h1 class="sr-only">یازدهمین کنفرانس بین‌المللی فناوری و مدیریت انرژی</h1>
    <img src="assets/img/header.jpg" alt="ICTEM 2026 – فناوری و مدیریت انرژی">
  </header>

  <main>
    <!-- حالت نمایش یک فایل: ?id=slug -->
    <section id="view" class="hidden">
      <div class="page-head">
        <div>
          <h2 id="v-title"></h2>
          <div class="meta" id="v-meta"></div>
        </div>
        <div class="grow"></div>
        <div class="toolbar">
          <span id="zoom-ui" class="zoombox hidden">
            <button class="btn sm" id="z-out" aria-label="کوچک‌نمایی">−</button>
            <span id="z-val">100%</span>
            <button class="btn sm" id="z-in" aria-label="بزرگ‌نمایی">+</button>
          </span>
          <button class="btn sm hidden" id="b-mode"></button>
          <button class="btn sm" id="b-copy">کپی لینک</button>
          <a class="btn sm" id="b-open" target="_blank" rel="noopener">باز کردن در تب جدید</a>
          <a class="btn sm yellow" id="b-dl" download>دانلود</a>
          <a class="btn sm" href="./" id="b-all">همه فایل‌ها</a>
        </div>
      </div>
      <div class="viewer" id="viewer"></div>
    </section>

    <!-- حالت فهرست -->
    <section id="home" class="hidden">
      <div class="page-head"><h2>فایل‌ها و برنامه‌ها</h2></div>
      <div class="card"><ul class="list" id="list"></ul></div>
    </section>

    <div id="state" class="status"><div class="spinner"></div>در حال بارگذاری…</div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>دانشگاه کاشان · ۵ و ۶ آبان</span>
      <a href="https://www.ictem.ir" target="_blank" rel="noopener">www.ictem.ir</a>
    </div>
  </footer>

  <script type="module" src="assets/js/viewer.js"></script>
</body>
</html>
