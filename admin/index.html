<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>پنل نویسنده · ICTEM</title>
  <meta name="theme-color" content="#14532d">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <span class="chip">پنل نویسنده</span>
      <h1 class="site-title">مدیریت فایل‌های <em>کنفرانس</em></h1>
    </div>
  </header>

  <main>
    <!-- تنظیمات اتصال -->
    <section class="card panel" id="p-conn">
      <h3>اتصال به GitHub</h3>
      <div class="grid">
        <label class="field">صاحب ریپو (username)
          <input type="text" id="c-owner" class="ltr" autocomplete="off">
        </label>
        <label class="field">نام ریپو
          <input type="text" id="c-repo" class="ltr" autocomplete="off">
        </label>
        <label class="field">شاخه (branch)
          <input type="text" id="c-branch" class="ltr" value="main" autocomplete="off">
        </label>
        <label class="field">توکن دسترسی (Fine-grained token)
          <input type="password" id="c-token" class="ltr" autocomplete="off" placeholder="github_pat_…">
          <small>فقط در همین مرورگر ذخیره می‌شود.</small>
        </label>
      </div>
      <div class="toolbar" style="margin-top:14px">
        <button class="btn primary" id="c-save">ورود و بارگذاری فهرست</button>
        <button class="btn" id="c-logout">خروج و حذف توکن</button>
      </div>
      <p class="msg" id="c-msg"></p>
    </section>

    <div id="work" class="hidden">
      <!-- آپلود / جایگزینی -->
      <section class="card panel">
        <h3 id="f-heading">افزودن فایل جدید</h3>
        <div class="grid">
          <label class="field">شناسه لینک (انگلیسی کوچک، عدد و خط تیره)
            <input type="text" id="f-id" class="ltr" placeholder="program-day1" autocomplete="off">
            <small>لینک نهایی ثابت می‌ماند: <span class="ltr" id="f-preview" style="display:inline-block"></span></small>
          </label>
          <label class="field">عنوان نمایشی
            <input type="text" id="f-title" placeholder="برنامه روز اول">
          </label>
          <label class="field">فایل (PDF, PNG, JPG, WEBP, GIF — حداکثر ۲۰ مگابایت)
            <input type="file" id="f-file" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,application/pdf,image/*">
          </label>
        </div>
        <label class="check" style="margin-top:12px">
          <input type="checkbox" id="f-listed" checked> در فهرست صفحه اصلی نمایش داده شود
        </label>
        <div class="toolbar" style="margin-top:14px">
          <button class="btn primary" id="f-submit">انتشار</button>
          <button class="btn hidden" id="f-cancel">انصراف از ویرایش</button>
        </div>
        <p class="msg" id="f-msg"></p>
      </section>

      <!-- فهرست -->
      <div class="page-head"><h2>فایل‌های منتشرشده</h2></div>
      <div class="card"><ul class="list" id="a-list"></ul></div>
      <p class="msg" id="a-msg"></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap"><span>برای دیدن سایت عمومی: <a href="../">صفحه اصلی</a></span></div>
  </footer>

  <script src="../assets/js/admin.js"></script>
</body>
</html>
